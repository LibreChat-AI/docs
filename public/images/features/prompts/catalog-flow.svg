<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
  <title id="title">Sync the catalog. Fetch content when a prompt is used.</title>
  <desc id="desc">Catalog sync adds read-only references from a Langfuse project to the LibreChat prompt library. When a user or agent uses a reference, LibreChat fetches the Production or pinned version from Langfuse and supplies the returned text to the chat or agent. Prompt content stays in Langfuse during sync.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>
  <rect width="960" height="490" rx="16" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif">
    <text x="32" y="42" font-size="22" font-weight="650" fill="#0f172a">One catalog. Content fetched when needed.</text>
    <text x="32" y="89" font-size="16" font-weight="650" fill="#475569">1. SYNC THE CATALOG</text>
    <rect x="32" y="112" width="270" height="96" rx="10" fill="#e2e8f0"/>
    <text x="167" y="150" text-anchor="middle" font-size="22" font-weight="600" fill="#0f172a">Langfuse project</text>
    <text x="167" y="179" text-anchor="middle" font-size="16" fill="#475569">Text prompts</text>
    <path d="M322 160H618" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="470" y="144" text-anchor="middle" font-size="16" fill="#475569">Add names and references</text>
    <text x="470" y="187" text-anchor="middle" font-size="14" fill="#475569">Prompt content is not copied</text>
    <rect x="640" y="112" width="288" height="96" rx="10" fill="#d1fae5" stroke="#059669"/>
    <text x="784" y="150" text-anchor="middle" font-size="22" font-weight="600" fill="#065f46">LibreChat library</text>
    <text x="784" y="179" text-anchor="middle" font-size="16" fill="#065f46">Read-only entries</text>
    <path d="M32 240H928" stroke="#cbd5e1"/>
    <text x="32" y="279" font-size="16" font-weight="650" fill="#475569">2. USE A PROMPT</text>
    <rect x="32" y="306" width="230" height="104" rx="10" fill="#d1fae5" stroke="#059669"/>
    <text x="147" y="345" text-anchor="middle" font-size="21" font-weight="600" fill="#065f46">Saved reference</text>
    <text x="147" y="376" text-anchor="middle" font-size="15" fill="#065f46">Selected in LibreChat</text>
    <path d="M280 358H338" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="356" y="306" width="250" height="104" rx="10" fill="#e2e8f0"/>
    <text x="481" y="340" text-anchor="middle" font-size="21" font-weight="600" fill="#0f172a">Fetch from Langfuse</text>
    <text x="481" y="367" text-anchor="middle" font-size="15" fill="#475569">Production label</text>
    <text x="481" y="389" text-anchor="middle" font-size="15" fill="#475569">or pinned version</text>
    <path d="M624 358H680" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="698" y="306" width="230" height="104" rx="10" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="813" y="345" text-anchor="middle" font-size="21" font-weight="600" fill="#312e81">Use the text</text>
    <text x="813" y="376" text-anchor="middle" font-size="15" fill="#3730a3">In a chat or agent turn</text>
    <text x="32" y="455" font-size="16" fill="#475569">Edit and promote prompts in Langfuse. Sync only adds library entries.</text>
  </g>
</svg>
