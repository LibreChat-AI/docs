<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Production follows updates. A pinned version stays fixed.</title>
  <desc id="desc">Before version 4 is promoted, both agents use version 3. After promotion, the agent following Production uses version 4. The pinned agent still uses version 3. Native cache settings can delay the update.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>
  <rect width="960" height="380" rx="16" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif">
    <text x="30" y="43" font-size="22" font-weight="650" fill="#0f172a">What happens when version 4 becomes Production?</text>
    <text x="367" y="91" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">BEFORE</text>
    <text x="792" y="91" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">AFTER</text>
    <text x="30" y="145" font-size="19" font-weight="600" fill="#0f172a">Follow Production</text>
    <text x="30" y="169" font-size="15" fill="#475569">Use the owner's updates</text>
    <rect x="280" y="113" width="174" height="74" rx="10" fill="#e2e8f0"/>
    <text x="367" y="158" text-anchor="middle" font-size="23" font-weight="600" fill="#0f172a">Version 3</text>
    <path d="M472 150H681" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="575" y="134" text-anchor="middle" font-size="14" fill="#475569">Promote version 4</text>
    <rect x="705" y="113" width="174" height="74" rx="10" fill="#d1fae5" stroke="#059669"/>
    <text x="792" y="158" text-anchor="middle" font-size="23" font-weight="600" fill="#065f46">Version 4</text>
    <text x="30" y="249" font-size="19" font-weight="600" fill="#0f172a">Pin version 3</text>
    <text x="30" y="273" font-size="15" fill="#475569">Keep this version</text>
    <rect x="280" y="217" width="174" height="74" rx="10" fill="#e2e8f0"/>
    <text x="367" y="262" text-anchor="middle" font-size="23" font-weight="600" fill="#0f172a">Version 3</text>
    <path d="M472 254H681" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="575" y="238" text-anchor="middle" font-size="14" fill="#475569">No change to this link</text>
    <rect x="705" y="217" width="174" height="74" rx="10" fill="#e2e8f0"/>
    <text x="792" y="262" text-anchor="middle" font-size="23" font-weight="600" fill="#0f172a">Version 3</text>
    <text x="30" y="344" font-size="15" fill="#475569">Native cache settings can delay a Production update. Langfuse links are fetched on each turn.</text>
  </g>
</svg>
